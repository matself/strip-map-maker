<?xml version="1.0" encoding="UTF-8"?>
<!-- Strip Map Maker north arrow: a ring with an arrow and an N, drawn as paths (no fonts).
     The ring is circular, so the arrow keeps the same apparent size at any rotation.
     SPDX-License-Identifier: GPL-2.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="#232323" stroke-width="3"/>
  <path d="M42 28 V14 L58 28 V14" fill="none" stroke="#232323" stroke-width="3.2"
        stroke-linejoin="miter" stroke-linecap="butt"/>
  <path d="M50 37 L68 86 L50 74 Z" fill="#232323" stroke="#232323" stroke-width="2"
        stroke-linejoin="miter"/>
  <path d="M50 37 L32 86 L50 74 Z" fill="#ffffff" stroke="#232323" stroke-width="2"
        stroke-linejoin="miter"/>
</svg>
