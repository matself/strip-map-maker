name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # QGIS 3 (long-term release) and the newest release. Verify the tags exist
        # on https://hub.docker.com/r/qgis/qgis and adjust (e.g. a pinned 4.x tag).

        qgis_tag: [ltr, latest]
    container:
      image: qgis/qgis:${{ matrix.qgis_tag }}

    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest --break-system-packages || pip install pytest
      - run: python3 -m pytest

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
